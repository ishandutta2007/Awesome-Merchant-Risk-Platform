<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Dynamic Animated Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes waveMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-40px); }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .glow-circle {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-node {
        animation: floatNode 4s ease-in-out infinite;
      }
      .banner-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: url(#textGrad);
        letter-spacing: -0.5px;
      }
      .banner-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #C7D2FE;
      }
    </style>
  </defs>

  <!-- Base Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Glowing Background Orbs (Dynamic Background) -->
  <circle cx="250" cy="120" r="220" fill="url(#glow1)" class="glow-circle" />
  <circle cx="950" cy="240" r="250" fill="url(#glow2)" class="glow-circle" style="animation-delay: -3s;" />

  <!-- Network Risk Mesh / Connections in Background -->
  <g stroke="#6366F1" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="100" y1="280" x2="220" y2="180" />
    <line x1="220" y1="180" x2="380" y2="240" />
    <line x1="820" y1="100" x2="960" y2="180" />
    <line x1="960" y1="180" x2="1100" y2="110" />
    <line x1="960" y1="180" x2="1050" y2="270" />
  </g>

  <!-- Network Nodes -->
  <g class="floating-node">
    <circle cx="220" cy="180" r="6" fill="#818CF8" />
    <circle cx="220" cy="180" r="12" fill="none" stroke="#818CF8" stroke-opacity="0.5" />
    <circle cx="380" cy="240" r="5" fill="#EC4899" />
    <circle cx="960" cy="180" r="7" fill="#38BDF8" />
    <circle cx="960" cy="180" r="14" fill="none" stroke="#38BDF8" stroke-opacity="0.4" />
  </g>

  <!-- Header Content Foreground -->
  <g transform="translate(60, 95)">
    <!-- Shield Icon Accent -->
    <g transform="translate(0, 0)">
      <path d="M24 4 L44 12 V26 C44 38 24 48 24 48 C24 48 4 38 4 26 V12 L24 4 Z" fill="none" stroke="#818CF8" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M16 24 L22 30 L32 18" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="60" y="38" class="banner-title">Awesome Merchant Risk Platform</text>
    <text x="60" y="74" class="banner-subtitle">Curated Ecosystem for E-Commerce Fraud Prevention, AML &amp; Real-Time Risk Engines</text>
  </g>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(120, 240)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="90" y="24" text-anchor="middle" class="badge-text">🛡️ Fraud Decisioning</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="185" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="92.5" y="24" text-anchor="middle" class="badge-text">📊 Velocity &amp; Scoring</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(395, 0)">
      <rect width="195" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="97.5" y="24" text-anchor="middle" class="badge-text">🔍 Graph &amp; Behavioral</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(605, 0)">
      <rect width="175" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="87.5" y="24" text-anchor="middle" class="badge-text">⚡ AML &amp; Rule Engines</text>
    </g>
  </g>
</svg>
